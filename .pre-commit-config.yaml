repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      - id: ruff-check
      - id: ruff-format
        files: ^(ocdeck|tests)/.*\.py$
  - repo: local
    hooks:
      - id: js-syntax
        name: Node syntax
        entry: python scripts/check-js.py
        language: system
        files: \.mjs$
        require_serial: true
