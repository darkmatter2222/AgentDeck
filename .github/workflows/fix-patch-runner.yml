name: Fix patch runner
on:
  push:
    branches: [fix/jelly-buttons-plugin-first-install]
    paths: [.github/workflows/fix-patch-runner.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jelly-buttons-plugin-first-install
      - name: Fix replacement callbacks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/apply-plugin-first-fix.yml')
          text = p.read_text(encoding='utf-8')
          text = text.replace('text = pattern.sub(replacement, text)', 'text = pattern.sub(lambda _m: replacement, text)')
          text = text.replace("    '''### Using HomeAILab or another local-model launcher?\\n", "    lambda _m: '''### Using HomeAILab or another local-model launcher?\\n")
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-plugin-first-fix.yml
          git commit -m "Fix patch runner regex replacements"
          git push origin HEAD:fix/jelly-buttons-plugin-first-install
