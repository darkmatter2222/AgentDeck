name: Publish AgentDeck v2.0.0

on:
  push:
    branches: [main]
    paths: [docs/releases/v2.0.0.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agentdeck-release-v2.0.0
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'darkmatter2222/AgentDeck' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out exact release source and build ZIP
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout "https://github.com/${GH_REPO}.git" source
          git -C source checkout --detach "$RELEASE_COMMIT"
          (cd source && sha256sum --check SHA256SUMS.txt)
          git -C source archive --format=zip --prefix=AgentDeck-v2.0.0/ \
            --output="$RUNNER_TEMP/AgentDeck-v2.0.0.zip" HEAD
          (cd "$RUNNER_TEMP" && sha256sum AgentDeck-v2.0.0.zip > AgentDeck-v2.0.0.zip.sha256)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test release source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install ./source
          cd source
          "$RUNNER_TEMP/release-venv/bin/python" -m unittest discover -s tests -v
          node --test tests/facts.test.mjs tests/harnesses.test.mjs
      - name: Publish release with notes and downloads
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.0.0 --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft"; then
            if [ "$(cat "$RUNNER_TEMP/release-draft")" = false ]; then
              echo 'v2.0.0 is already published; leaving it unchanged.'
              exit 0
            fi
            gh release upload v2.0.0 "$RUNNER_TEMP/AgentDeck-v2.0.0.zip" \
              "$RUNNER_TEMP/AgentDeck-v2.0.0.zip.sha256" --clobber
          else
            gh release create v2.0.0 "$RUNNER_TEMP/AgentDeck-v2.0.0.zip" \
              "$RUNNER_TEMP/AgentDeck-v2.0.0.zip.sha256" \
              --target "$RELEASE_COMMIT" --title 'AgentDeck v2.0.0 — Make every key your own' \
              --notes-file source/docs/releases/v2.0.0.md --draft
          fi
          gh release edit v2.0.0 --draft=false --latest
          gh release view v2.0.0 --json url --jq '.url'
