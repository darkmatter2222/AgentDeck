name: Format plugin-first branch
on:
  push:
    branches: [fix/jelly-buttons-plugin-first-install]
    paths: [.github/workflows/ruff-branch-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jelly-buttons-plugin-first-install
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.12.12
      - run: ruff format ocdeck/device.py ocdeck/direct_hooks.py tests/test_plugin_first.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ocdeck/device.py ocdeck/direct_hooks.py tests/test_plugin_first.py
          git diff --cached --quiet && exit 0
          git commit -m "Format plugin-first input fixes"
          git push origin HEAD:fix/jelly-buttons-plugin-first-install
