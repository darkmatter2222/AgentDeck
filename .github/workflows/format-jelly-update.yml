name: Format Jelly update feature

on:
  push:
    branches: [feature/jelly-pypi-self-update]
    paths: [.github/workflows/format-jelly-update.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jelly-pypi-self-update
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.12.12
      - run: ruff format ocdeck/jelly_update.py ocdeck/updates.py tests/test_jelly_self_update.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ocdeck/jelly_update.py ocdeck/updates.py tests/test_jelly_self_update.py
          git diff --cached --quiet && exit 0
          git commit -m "Format Jelly update implementation"
          git push origin HEAD:feature/jelly-pypi-self-update
