name: Automatic main release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: agentstreamdeck-main-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.repository == 'darkmatter2222/AgentStreamDeck'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.version.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next patch release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          existing="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$existing" ]; then
            echo "Current commit is already released as $existing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            echo "version=${existing#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi

          IFS='.' read -r major minor patch <<< "${latest#v}"
          next_patch=$((10#$patch + 1))
          version="${major}.${minor}.${next_patch}"
          tag="v${version}"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag after $latest"

      - uses: actions/setup-python@v5
        if: steps.version.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Stamp release version in build workspace
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['VERSION']

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text(encoding='utf-8')
          text, count = re.subn(r'(?m)^version = "[^"]+"$', f'version = "{version}"', text, count=1)
          if count != 1:
              raise SystemExit('Could not update pyproject.toml version')
          pyproject.write_text(text, encoding='utf-8')

          init = Path('ocdeck/__init__.py')
          text = init.read_text(encoding='utf-8')
          text, count = re.subn(r'(?m)^__version__ = "[^"]+"$', f'__version__ = "{version}"', text, count=1)
          if count != 1:
              raise SystemExit('Could not update ocdeck.__version__')
          init.write_text(text, encoding='utf-8')
          PY

      - name: Verify source
        if: steps.version.outputs.skip != 'true'
        run: |
          python -m pip install -e ".[dev]" cyclonedx-bom twine
          python -m unittest discover -s tests -v
          node --test tests/facts.test.mjs tests/harnesses.test.mjs tests/next.test.mjs
          ruff check ocdeck tests
          ruff format --check ocdeck tests
          pyright

      - name: Build release assets
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          python -m build
          python -m twine check dist/*
          cyclonedx-py environment --of JSON -o dist/sbom.json

          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          tag = os.environ['TAG']
          out = Path('dist') / f'AgentStreamDeck-{tag}.zip'
          prefix = f'AgentStreamDeck-{tag}/'
          files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          with ZipFile(out, 'w', ZIP_DEFLATED) as archive:
              for name in files:
                  path = Path(name)
                  if path.is_file():
                      archive.write(path, prefix + name)
          PY

          if [ -f docs/jelly/jelly_v3_showcase.mp4 ]; then
            cp docs/jelly/jelly_v3_showcase.mp4 dist/
          fi
          if [ -f docs/jelly/readme_hero.gif ]; then
            cp docs/jelly/readme_hero.gif dist/
          fi

          (cd dist && sha256sum * > SHA256SUMS.txt)

      - uses: actions/attest-build-provenance@v2
        if: steps.version.outputs.skip != 'true'
        with:
          subject-path: dist/*

      - name: Publish GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "AgentStreamDeck $TAG" \
              --generate-notes \
              --latest
          fi

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.skip != 'true'
        with:
          name: python-release
          path: |
            dist/*.whl
            dist/*.tar.gz

  publish-pypi:
    if: needs.release.outputs.skip != 'true'
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentstreamdeck
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-release
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: true
