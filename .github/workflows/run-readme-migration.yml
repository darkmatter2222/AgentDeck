name: Run README migration helper
on:
  push:
    branches:
      - fix/jelly-buttons-plugin-first-install
    paths:
      - scripts/_patch_readme_plugin_first.py
      - .github/workflows/run-readme-migration.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jelly-buttons-plugin-first-install
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/_patch_readme_plugin_first.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Finish plugin-first README documentation"
          git push origin HEAD:fix/jelly-buttons-plugin-first-install
