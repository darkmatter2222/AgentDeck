name: Run corrected patch
on:
  push:
    branches: [fix/jelly-buttons-plugin-first-install]
    paths: [.github/workflows/run-corrected-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jelly-buttons-plugin-first-install
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute corrected source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/apply-plugin-first-fix.yml').read_text(encoding='utf-8')
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          script = script.replace('text = pattern.sub(replacement, text)', 'text = pattern.sub(lambda _m: replacement, text)')
          script = script.replace("    '''### Using HomeAILab or another local-model launcher?\\n", "    lambda _m: '''### Using HomeAILab or another local-model launcher?\\n")
          exec(compile(script, '<corrected-patch>', 'exec'), {})
          PY
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ocdeck plugins scripts README.md docs tests
          git commit -m "Fix Jelly gestures, physical buttons, and plugin-first startup"
          git push origin HEAD:fix/jelly-buttons-plugin-first-install
