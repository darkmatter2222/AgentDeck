name: Apply plugin-first fix

on:
  push:
    branches: [fix/jelly-buttons-plugin-first-install]
    paths: [.github/workflows/apply-plugin-first-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jelly-buttons-plugin-first-install
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing replacement in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # 1. Jelly gestures: compact blob nubs only. No long line/pseudopod arms.
          p = Path('ocdeck/jelly_art.py')
          text = p.read_text(encoding='utf-8')
          old = '''    if pose == "double_arch" and not gesture:\n        gesture, step = "cheer", 3\n    if gesture and step:\n        # A growing, thick pseudopod shares the outline and fill of the body.\n        length = (2, 4, 7, 8)[min(step, 4) - 1]\n        root = (right - 3, base - 7)\n        tip = (min(38, root[0] + length), root[1] - (length if gesture == "wave" else 2))\n        elbow = (min(36, root[0] + length - 1), root[1] - 2)\n        if gesture == "wave" and step == 4:\n            tip = (tip[0] - 2, tip[1] - 1)\n        if gesture in ("up", "scratch", "cheer", "clap"):\n            tip = (30 if gesture != "scratch" else 24, max(2, top - 2))\n            if gesture == "clap":\n                tip = (22 if step % 2 else 27, max(2, top - 2))\n        elif gesture == "down":\n            tip = (min(38, right + 1), base - 1)\n        d.line([root, elbow, tip], fill=outline, width=5)\n        d.line([root, elbow, tip], fill=body, width=3)\n        d.point(tip, fill=light)\n        if gesture in ("cheer", "clap"):\n            d.line([(40 - root[0], root[1]), (40 - elbow[0], elbow[1]), (40 - tip[0], tip[1])], fill=outline, width=5)\n            d.line([(40 - root[0], root[1]), (40 - elbow[0], elbow[1]), (40 - tip[0], tip[1])], fill=body, width=3)\n'''
          new = '''    if pose == "double_arch" and not gesture:\n        gesture, step = "cheer", 3\n    if gesture and step:\n        # Jelly has short, rounded flippers, never line-drawn stick arms. Keep every\n        # gesture attached to the silhouette and at/below the crown so even cheer,\n        # scratch, clap and point poses still read as one soft blob.\n        reach = min(4, max(2, int(step) + 1))\n\n        def nub(side, center_y, lift=0):\n            y = max(top + 2, min(base - 3, center_y - lift))\n            if side < 0:\n                box = (max(0, left - reach), y - 2, left + 2, y + 2)\n                highlight = (max(0, left - reach + 1), y - 1)\n            else:\n                box = (right - 2, y - 2, min(GRID - 1, right + reach), y + 2)\n                highlight = (min(GRID - 1, right + reach - 1), y - 1)\n            d.ellipse(box, fill=outline)\n            inner = (box[0] + 1, box[1] + 1, box[2] - 1, box[3] - 1)\n            if inner[0] <= inner[2] and inner[1] <= inner[3]:\n                d.ellipse(inner, fill=body)\n            d.point(highlight, fill=light)\n\n        upper = top + max(4, h // 3)\n        middle = top + max(5, h // 2)\n        if gesture in ("cheer", "clap"):\n            # Two happy shoulder-flippers. Clap changes their height rather than\n            # extending them toward the top of the key.\n            lift = 1 if gesture == "clap" and step % 2 else 0\n            nub(-1, upper, lift)\n            nub(1, upper, lift)\n        elif gesture in ("up", "scratch"):\n            nub(1, upper, 1 if gesture == "scratch" else 0)\n        elif gesture == "down":\n            nub(1, base - 5)\n        else:\n            # wave and point remain side gestures. Mirroring is applied later by\n            # sprite(), so point-left and point-right share the same safe art.\n            wave_lift = 1 if gesture == "wave" and step in (2, 4) else 0\n            nub(1, middle, wave_lift)\n'''
          if old not in text:
              raise SystemExit('jelly gesture block not found')
          p.write_text(text.replace(old, new), encoding='utf-8')

          # 2. HID input path: normalize report-id-less reads, monitor read thread and expose input telemetry.
          replace('ocdeck/device.py', '''    def read(self, length):\n        value = self._call("read", length)\n        return bytes(value) if value else None\n''', '''    def read(self, length):\n        value = self._call("read", length)\n        if not value:\n            return None\n        data = bytes(value)\n        if len(data) == length:\n            return data\n        # cython-hidapi returns the number of bytes physically read, while the\n        # StreamDeck transport contract expects a report-id byte at index zero.\n        # Some Windows HID paths omit that zero report id for unnumbered reports.\n        if len(data) == length - 1:\n            return b"\\x00" + data\n        from StreamDeck.Transport.Transport import TransportError\n\n        raise TransportError(f"Unexpected HID input report length: {len(data)}/{length}")\n''')
          replace('ocdeck/device.py', '''        self.status = {"online": False, "mock": mock, "error": "Not connected", "frames": 0}\n''', '''        self.status = {\n            "online": False,\n            "mock": mock,\n            "error": "Not connected",\n            "frames": 0,\n            "input_events": 0,\n            "last_input": None,\n        }\n''')
          replace('ocdeck/device.py', '''                    self.deck.open()\n                    self.registry.resize(self.deck.key_count())\n''', '''                    self.deck.open()\n                    if hasattr(self.deck, "set_poll_frequency"):\n                        self.deck.set_poll_frequency(60)\n                    self.registry.resize(self.deck.key_count())\n''')
          replace('ocdeck/device.py', '''                    self.deck.set_key_callback(lambda deck, key, state: self.press(key, state))\n                    self.status.update(serial=devices[0].get("serial_number"), productId=devices[0]["product_id"])\n''', '''                    def on_key(_deck, key, state):\n                        self.status["input_events"] = int(self.status.get("input_events", 0)) + 1\n                        self.status["last_input"] = {"key": int(key), "pressed": bool(state), "time": time.time()}\n                        self.press(key, state)\n\n                    self.deck.set_key_callback(on_key)\n                    self.status.update(serial=devices[0].get("serial_number"), productId=devices[0]["product_id"])\n''')
          replace('ocdeck/device.py', '''                        if not self.deck.is_open() or not self.deck.connected():\n                            raise OSError("Mini disconnected")\n                        next_probe = start + 2\n''', '''                        if not self.deck.is_open() or not self.deck.connected():\n                            raise OSError("Stream Deck disconnected")\n                        reader = getattr(self.deck, "read_thread", None) or getattr(self.deck, "_read_thread", None)\n                        if reader is not None and not reader.is_alive():\n                            raise OSError("Stream Deck input reader stopped")\n                        next_probe = start + 2\n''')

          # 3. Event-driven registrations stay current between native hook events and retain window hints.
          replace('ocdeck/model.py', '''                    "windowToken": str(data.get("windowToken", ""))[:128],\n                    "seq": -1,\n''', '''                    "windowToken": str(data.get("windowToken", ""))[:128],\n                    "windowHwnd": int(data.get("windowHwnd", 0) or 0),\n                    "windowPid": int(data.get("windowPid", 0) or 0),\n                    "eventDriven": bool(data.get("eventDriven", False)),\n                    "seq": -1,\n''')
          replace('ocdeck/model.py', '''            elif data.get("process") != record["process"]:\n                raise ValueError("instance process identity cannot change")\n            record["lastSeen"] = self.clock()\n''', '''            elif data.get("process") != record["process"]:\n                raise ValueError("instance process identity cannot change")\n            if data.get("windowHwnd"):\n                record["windowHwnd"] = int(data["windowHwnd"])\n            if data.get("windowPid"):\n                record["windowPid"] = int(data["windowPid"])\n            if data.get("eventDriven"):\n                record["eventDriven"] = True\n            record["lastSeen"] = self.clock()\n''')
          replace('ocdeck/model.py', '''                    if self.clock() - r["lastState"] > self.stale_after or r["status"] == "unknown":\n''', '''                    if (\n                        not r.get("eventDriven")\n                        and self.clock() - r["lastState"] > self.stale_after\n                        or r["status"] == "unknown"\n                    ):\n''')

          # 4. Focus: capture/resolve the containing visible ancestor window so launchers are optional.
          Path('ocdeck/focus.py').write_text(textwrap.dedent(r'''\
          """Focus an existing Windows window associated with a registered harness process."""

          import ctypes
          from ctypes import wintypes
          import os
          import time


          class GUIThreadInfo(ctypes.Structure):
              _fields_ = [
                  ("cbSize", wintypes.DWORD),
                  ("flags", wintypes.DWORD),
                  ("hwndActive", wintypes.HWND),
                  ("hwndFocus", wintypes.HWND),
                  ("hwndCapture", wintypes.HWND),
                  ("hwndMenuOwner", wintypes.HWND),
                  ("hwndMoveSize", wintypes.HWND),
                  ("hwndCaret", wintypes.HWND),
                  ("rcCaret", wintypes.RECT),
              ]


          def _api():
              u = ctypes.WinDLL("user32", use_last_error=True)
              u.GetForegroundWindow.restype = wintypes.HWND
              u.IsWindowVisible.argtypes = [wintypes.HWND]
              u.IsIconic.argtypes = [wintypes.HWND]
              u.SetForegroundWindow.argtypes = [wintypes.HWND]
              u.GetWindowTextLengthW.argtypes = [wintypes.HWND]
              u.GetWindowTextW.argtypes = [wintypes.HWND, wintypes.LPWSTR, ctypes.c_int]
              u.GetWindowThreadProcessId.argtypes = [wintypes.HWND, ctypes.POINTER(wintypes.DWORD)]
              u.GetWindowThreadProcessId.restype = wintypes.DWORD
              u.IsChild.argtypes = [wintypes.HWND, wintypes.HWND]
              u.IsChild.restype = wintypes.BOOL
              u.ShowWindowAsync.argtypes = [wintypes.HWND, ctypes.c_int]
              u.ShowWindowAsync.restype = wintypes.BOOL
              u.GetGUIThreadInfo.argtypes = [wintypes.DWORD, ctypes.POINTER(GUIThreadInfo)]
              u.GetGUIThreadInfo.restype = wintypes.BOOL
              u.PeekMessageW.argtypes = [ctypes.POINTER(wintypes.MSG), wintypes.HWND, wintypes.UINT, wintypes.UINT, wintypes.UINT]
              u.PeekMessageW.restype = wintypes.BOOL
              u.AttachThreadInput.argtypes = [wintypes.DWORD, wintypes.DWORD, wintypes.BOOL]
              u.AttachThreadInput.restype = wintypes.BOOL
              u.BringWindowToTop.argtypes = [wintypes.HWND]
              u.BringWindowToTop.restype = wintypes.BOOL
              for name in ("IsWindow", "IsHungAppWindow"):
                  getattr(u, name).argtypes = [wintypes.HWND]
                  getattr(u, name).restype = wintypes.BOOL
              for name in ("SetFocus", "SetActiveWindow"):
                  getattr(u, name).argtypes = [wintypes.HWND]
                  getattr(u, name).restype = wintypes.HWND
              return u


          def _pid_chain(pid):
              try:
                  import psutil

                  process = psutil.Process(int(pid))
                  result = [process.pid]
                  for parent in process.parents()[:12]:
                      result.append(parent.pid)
                  return result
              except (ValueError, TypeError, Exception):
                  return [int(pid)] if str(pid).isdigit() else []


          def _owner_pid(u, hwnd):
              pid = wintypes.DWORD()
              u.GetWindowThreadProcessId(hwnd, ctypes.byref(pid))
              return int(pid.value)


          def capture_window(pid):
              """Capture the visible ancestor window for a native hook's harness process."""
              if os.name != "nt":
                  return {}
              u = _api()
              chain = _pid_chain(pid)
              if not chain:
                  return {}
              distance = {value: index for index, value in enumerate(chain)}
              foreground = u.GetForegroundWindow()
              if foreground and u.IsWindowVisible(foreground):
                  owner = _owner_pid(u, foreground)
                  if owner in distance:
                      return {"windowHwnd": int(foreground), "windowPid": owner}
              callback_type = ctypes.WINFUNCTYPE(wintypes.BOOL, wintypes.HWND, wintypes.LPARAM)
              candidates = []

              @callback_type
              def collect(hwnd, _):
                  if u.IsWindowVisible(hwnd):
                      owner = _owner_pid(u, hwnd)
                      if owner in distance:
                          candidates.append((distance[owner], int(hwnd), owner))
                  return True

              u.EnumWindows(collect, 0)
              if not candidates:
                  return {}
              best = min(item[0] for item in candidates)
              nearest = [item for item in candidates if item[0] == best]
              if len(nearest) != 1:
                  return {}
              _, hwnd, owner = nearest[0]
              return {"windowHwnd": hwnd, "windowPid": owner}


          def activate(record):
              if os.name != "nt":
                  return {"ok": False, "reason": "Windows host required"}
              u = _api()
              stored = int(record.get("windowHwnd", 0) or 0)
              if stored and u.IsWindow(stored) and u.IsWindowVisible(stored):
                  candidates = [stored]
              else:
                  token = record.get("windowToken", "")
                  chain = _pid_chain(record.get("process", {}).get("pid", 0))
                  if record.get("windowPid") and int(record["windowPid"]) not in chain:
                      chain.insert(0, int(record["windowPid"]))
                  distance = {value: index for index, value in enumerate(chain)}
                  token_candidates = []
                  process_candidates = []
                  callback_type = ctypes.WINFUNCTYPE(wintypes.BOOL, wintypes.HWND, wintypes.LPARAM)

                  @callback_type
                  def collect(hwnd, _):
                      if not u.IsWindowVisible(hwnd):
                          return True
                      length = u.GetWindowTextLengthW(hwnd)
                      title = ctypes.create_unicode_buffer(length + 1)
                      u.GetWindowTextW(hwnd, title, len(title))
                      owner = _owner_pid(u, hwnd)
                      if token and title.value == token:
                          token_candidates.append(int(hwnd))
                      elif not token and owner in distance:
                          process_candidates.append((distance[owner], int(hwnd)))
                      return True

                  u.EnumWindows(collect, 0)
                  if token:
                      candidates = token_candidates
                  elif process_candidates:
                      best = min(item[0] for item in process_candidates)
                      candidates = [hwnd for dist, hwnd in process_candidates if dist == best]
                  else:
                      candidates = []
              if len(candidates) != 1:
                  return {
                      "ok": False,
                      "reason": "Window mapping ambiguous or absent; keep one harness per OS window for one-touch focus",
                      "matches": len(candidates),
                  }
              kernel = ctypes.WinDLL("kernel32", use_last_error=True)
              kernel.GetCurrentThreadId.restype = wintypes.DWORD
              return focus_window(u, kernel.GetCurrentThreadId(), candidates[0])


          def focus_window(u, current, hwnd, sleep=time.sleep):
              """Activate a resolved window; input attachment is temporary and always undone."""
              target = u.GetWindowThreadProcessId(hwnd, None)
              if not target or not u.IsWindow(hwnd):
                  return {"ok": False, "reason": "Target window closed", "hwnd": int(hwnd)}
              if u.IsHungAppWindow(hwnd):
                  return {"ok": False, "reason": "Target window is not responding", "hwnd": int(hwnd)}

              def focused_child():
                  info = GUIThreadInfo()
                  info.cbSize = ctypes.sizeof(info)
                  if u.GetGUIThreadInfo(target, ctypes.byref(info)):
                      child = info.hwndFocus
                      if child and (child == hwnd or u.IsChild(hwnd, child)):
                          return child
                  return None

              def confirmed():
                  return u.GetForegroundWindow() == hwnd and not u.IsIconic(hwnd) and bool(focused_child())

              child = focused_child()
              if u.IsIconic(hwnd):
                  u.ShowWindowAsync(hwnd, 9)
              accepted = bool(u.SetForegroundWindow(hwnd))
              for _ in range(5):
                  if confirmed():
                      return {"ok": True, "hwnd": int(hwnd), "method": "SetForegroundWindow", "keyboardFocus": True}
                  sleep(0.04)

              message = wintypes.MSG()
              u.PeekMessageW(ctypes.byref(message), None, 0, 0, 0)
              foreground = u.GetForegroundWindow()
              other = u.GetWindowThreadProcessId(foreground, None) if foreground else 0
              attached, failed = [], []
              try:
                  for thread in dict.fromkeys((other, target)):
                      if not thread or thread == current:
                          continue
                      if u.AttachThreadInput(current, thread, True):
                          attached.append(thread)
                      else:
                          failed.append(thread)
                  if u.IsWindow(hwnd):
                      u.BringWindowToTop(hwnd)
                      u.SetForegroundWindow(hwnd)
                      if target == current or target in attached:
                          u.SetActiveWindow(hwnd)
                          focus = focused_child()
                          if not focus and child and u.IsWindow(child) and u.IsChild(hwnd, child):
                              focus = child
                          u.SetFocus(focus or hwnd)
              finally:
                  for thread in reversed(attached):
                      u.AttachThreadInput(current, thread, False)
              for _ in range(5):
                  if confirmed():
                      return {"ok": True, "hwnd": int(hwnd), "method": "AttachThreadInput", "keyboardFocus": True}
                  sleep(0.04)
              return {
                  "ok": False,
                  "reason": "Windows denied foreground or keyboard focus",
                  "hwnd": int(hwnd),
                  "apiAccepted": accepted,
                  "foreground": int(u.GetForegroundWindow() or 0),
                  "keyboardFocus": bool(focused_child()),
                  "attachmentFailures": failed,
              }
          '''), encoding='utf-8')

          # 5. Direct native hook ingestion: no managed launcher/bridge required.
          Path('ocdeck/direct_hooks.py').write_text(textwrap.dedent(r'''\
          """Event-driven native harness hooks that register directly with the local broker."""

          import hashlib
          import time
          from pathlib import Path

          from .focus import capture_window

          PROFILES = {
              "codex": "Codex",
              "claude": "Claude",
              "copilot-cli": "Copilot CLI",
              "copilot-vscode": "Copilot VS Code",
              "gemini": "Gemini",
              "cursor": "Cursor CLI",
          }
          ACTIONS = {
              "start",
              "end",
              "idle",
              "busy",
              "tool",
              "result",
              "error",
              "permission",
              "codex-permission",
              "notification",
          }


          def _identity(pid):
              import psutil

              process = psutil.Process(int(pid))
              return {"pid": process.pid, "created": process.create_time()}


          class DirectHooks:
              def __init__(self, registry):
                  self.registry = registry
                  self.states = {}

              @staticmethod
              def key(profile, session):
                  digest = hashlib.sha256(f"{profile}\0{session}".encode()).hexdigest()[:32]
                  return f"hook-{profile}-{digest}"

              def _register(self, profile, session, parent_pid, cwd):
                  key = self.key(profile, session)
                  state = self.states.get(key)
                  if state and self.registry.probe(state["process"]) is not True:
                      self.registry.remove(key)
                      self.states.pop(key, None)
                      state = None
                  if state:
                      self.registry.upsert(state["registration"])
                      return key, state
                  process = _identity(parent_pid)
                  window = capture_window(process["pid"])
                  project = Path(str(cwd or ".")).name or PROFILES[profile]
                  registration = {
                      "id": key,
                      "process": process,
                      "windowToken": "",
                      "harness": profile,
                      "label": f"{PROFILES[profile]}:{project}",
                      "eventDriven": True,
                      **window,
                  }
                  self.registry.upsert(registration)
                  state = {
                      "process": process,
                      "registration": registration,
                      "producer": f"native-{profile}",
                      "seq": 0,
                      "status": "unknown",
                      "pending": set(),
                      "input": False,
                      "detail": "Waiting for first native hook",
                  }
                  self.states[key] = state
                  return key, state

              def event(self, body):
                  profile = body.get("profile")
                  event = body.get("event")
                  parent_pid = body.get("parentPid")
                  if profile not in PROFILES or not isinstance(event, dict):
                      raise ValueError("Invalid native hook profile/event")
                  action = event.get("action")
                  session = event.get("session")
                  if action not in ACTIONS or not isinstance(session, str) or not 1 <= len(session) <= 512:
                      raise ValueError("Invalid native hook action/session")
                  if type(parent_pid) is not int or parent_pid <= 0:
                      raise ValueError("Invalid native hook parent process")
                  key = self.key(profile, session)
                  if action == "end":
                      self.registry.remove(key)
                      self.states.pop(key, None)
                      return {"ok": True, "removed": True}
                  key, state = self._register(profile, session, parent_pid, body.get("cwd", "."))
                  request = event.get("request") if isinstance(event.get("request"), str) else ""
                  question = bool(event.get("question"))
                  failed = bool(event.get("failed"))
                  if action in ("start", "idle"):
                      state["status"] = "idle"
                      state["pending"].clear()
                      state["input"] = False
                      state["detail"] = ""
                  elif action == "busy":
                      state["status"] = "busy"
                      state["pending"].clear()
                      state["input"] = False
                      state["detail"] = ""
                  elif action == "tool":
                      state["status"] = "busy"
                      state["input"] = False
                      if question and request:
                          state["pending"].add(request)
                      state["detail"] = ""
                  elif action == "result":
                      state["status"] = "busy"
                      if request:
                          state["pending"].discard(request)
                      state["input"] = False
                      state["detail"] = ""
                  elif action == "codex-permission":
                      state["status"] = "busy"
                      state["input"] = True
                      state["detail"] = "Approval requested; count unknown"
                  elif action == "permission":
                      state["status"] = "unknown"
                      state["input"] = False
                      state["detail"] = "Permission decision; no paired request ID"
                  elif action == "notification":
                      state["status"] = "unknown"
                      state["detail"] = "Permission notification; inspect harness"
                  elif action == "error" or failed:
                      state["status"] = "unknown"
                      state["pending"].clear()
                      state["input"] = False
                      state["detail"] = "Harness error; inspect terminal"
                  request_ids = [
                      hashlib.sha256(f"{session}\0{value}".encode()).hexdigest() for value in sorted(state["pending"])
                  ]
                  snapshot = {
                      "status": state["status"],
                      "pending": len(state["pending"]),
                      "pendingKnown": False,
                      "inputNeeded": state["input"],
                      "requestIds": request_ids,
                      "detail": state["detail"],
                      "producer": state["producer"],
                      "seq": state["seq"] + 1,
                  }
                  outcome = event.get("outcome")
                  if outcome in ("success", "failure"):
                      snapshot["outcome"] = outcome
                      snapshot["outcomeId"] = hashlib.sha256(
                          f"{session}\0{event.get('event', '')}\0{request}\0{time.time_ns()}".encode()
                      ).hexdigest()
                  if not self.registry.snapshot(key, snapshot):
                      return {"ok": False, "reason": "stale native hook"}
                  state["seq"] = snapshot["seq"]
                  return {"ok": True, "slot": self.registry.records[key]["slot"]}
          '''), encoding='utf-8')

          replace('ocdeck/broker.py', '''from .settings import validate_config\n''', '''from .settings import validate_config\nfrom .direct_hooks import DirectHooks\n''')
          replace('ocdeck/broker.py', '''        self.registry = Registry(probe, slots=self.config.get("slots", 6), secrets=(self.token,))\n        self.alerts = Alerts(self.config)\n''', '''        self.registry = Registry(probe, slots=self.config.get("slots", 6), secrets=(self.token,))\n        self.direct_hooks = DirectHooks(self.registry)\n        self.alerts = Alerts(self.config)\n''')
          replace('ocdeck/broker.py', '''        if method == "POST" and path == "/v1/register":\n            record = self.registry.upsert(body)\n            return {"epoch": self.registry.epoch, "slot": record["slot"]}\n''', '''        if method == "POST" and path == "/v1/register":\n            record = self.registry.upsert(body)\n            return {"epoch": self.registry.epoch, "slot": record["slot"]}\n        if method == "POST" and path == "/v1/hook":\n            return self.direct_hooks.event(body)\n''')

          # 6. Native JS hooks deliver straight to broker when no managed binding exists.
          replace('plugins/harnesses/profiles.mjs', '''  return {event, session, tool: str(input.tool_name || input.toolName),\n    request: str(input.tool_use_id || input.toolUseId),\n    notification: str(input.notification_type), failed: input.status === 'error' || input.status === 'aborted',\n''', '''  const tool = str(input.tool_name || input.toolName);\n  return {event, action:p.events[event], session, tool, question:p.questions.includes(tool),\n    request: str(input.tool_use_id || input.toolUseId),\n    notification: str(input.notification_type), failed: input.status === 'error' || input.status === 'aborted',\n''')
          Path('plugins/harnesses/hook.mjs').write_text(textwrap.dedent(r'''\
          // Short-lived observer. It never makes approval decisions and always exits zero.
          import fs from 'node:fs/promises';
          import os from 'node:os';
          import path from 'node:path';
          import {writeFileSync} from 'node:fs';
          import {normalize} from './profiles.mjs';

          const [profile, event] = process.argv.slice(2);
          const descriptor = process.env.AGENTDECK_HOOK_BINDING;
          const timer = setTimeout(() => {
            if (descriptor) { try { writeFileSync(descriptor + '.failed', '1', {mode:0o600}); } catch {} }
            if (profile === 'gemini') process.stdout.write('{}\n');
            process.exit(0);
          }, 1800);

          async function direct(value) {
            const root = process.env.OCDECK_HOME || path.join(os.homedir(), '.opencode-deck');
            const discovery = JSON.parse(await fs.readFile(path.join(root, 'discovery.json'), 'utf8'));
            const token = (await fs.readFile(path.join(root, 'token'), 'utf8')).trim();
            if (!Number.isInteger(discovery.port) || discovery.port < 1 || discovery.port > 65535) throw Error('Bad broker port');
            const response = await fetch(`http://127.0.0.1:${discovery.port}/v1/hook`, {
              method:'POST', headers:{Authorization:`Bearer ${token}`, 'Content-Type':'application/json'},
              body:JSON.stringify({profile, event:value, parentPid:process.ppid, cwd:process.cwd()}),
              signal:AbortSignal.timeout(900)
            });
            if (!response.ok) throw Error('Broker delivery failed');
          }

          try {
            process.stdin.setEncoding('utf8');
            let input = '', size = 0;
            for await (const chunk of process.stdin) {
              size += Buffer.byteLength(chunk);
              if (size > 4 * 1024 * 1024) throw Error('Oversized hook input');
              input += chunk;
            }
            const value = normalize(profile, event, JSON.parse(input));
            if (!value) throw Error('Invalid hook input');
            if (descriptor) {
              const d = JSON.parse(await fs.readFile(descriptor, 'utf8'));
              if (d.profile !== profile || !Number.isInteger(d.port) || d.port < 1 || d.port > 65535) throw Error('Bad binding');
              const response = await fetch(`http://127.0.0.1:${d.port}/event`, {method:'POST',
                headers:{Authorization:`Bearer ${d.token}`, 'Content-Type':'application/json'},
                body:JSON.stringify(value), signal:AbortSignal.timeout(800)});
              if (!response.ok) throw Error('Delivery failed');
            } else {
              await direct(value);
            }
          } catch {
            if (descriptor) { try { await fs.writeFile(descriptor + '.failed', '1', {mode:0o600}); } catch {} }
          } finally {
            clearTimeout(timer);
            if (profile === 'gemini') process.stdout.write('{}\n');
            process.exit(0);
          }
          '''), encoding='utf-8')

